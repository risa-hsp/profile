<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>ミニ動画｜ママ友が嫌いじゃないのに疲れる私が、やめたこと</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #FDFBF7;
            color: #4A4A4A;
            font-family: "Shippori Mincho", serif;
            letter-spacing: 0.05em;
            line-height: 2;
        }
        .wrap {
            max-width: 640px;
            margin: 0 auto;
            padding: 48px 20px 64px;
            text-align: center;
        }
        .brand {
            font-family: "Cormorant Garamond", serif;
            font-size: 13px;
            letter-spacing: 5px;
            color: #9c8c8c;
        }
        .deco { color: #d4b5b5; font-size: 14px; letter-spacing: 10px; margin: 18px 0 26px; }
        .label {
            font-family: "Cormorant Garamond", serif;
            font-size: 12px;
            letter-spacing: 4px;
            color: #Cca352;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 19px;
            font-weight: 600;
            line-height: 1.9;
            margin-bottom: 30px;
        }
        .video-card {
            max-width: 360px;
            margin: 0 auto 14px;
            background: #ffffff;
            border: 1px solid #E8DCC4;
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
        }
        video {
            width: 100%;
            aspect-ratio: 9 / 16;
            display: block;
            border-radius: 8px;
            background: #EDE5D2;
        }
        .meta {
            font-family: "Zen Kaku Gothic New", sans-serif;
            font-size: 11px;
            color: #9a948e;
            margin-bottom: 40px;
        }
        .message {
            font-size: 14px;
            text-align: left;
            background: #ffffff;
            border-left: 3px solid #E8D1CB;
            border-radius: 0 10px 10px 0;
            padding: 22px 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            margin-bottom: 32px;
        }
        .btn {
            display: block;
            max-width: 360px;
            margin: 0 auto 44px;
            text-align: center;
            font-family: "Zen Kaku Gothic New", sans-serif;
            font-size: 13.5px;
            letter-spacing: 0.12em;
            color: #ffffff;
            background: #B9A48C;
            border-radius: 999px;
            padding: 13px 18px;
            text-decoration: none;
            transition: opacity .2s;
        }
        .btn:hover { opacity: .82; }
        .footer { font-size: 12px; color: #9c8c8c; }
        .footer a { color: #Cca352; text-decoration: none; border-bottom: 1px solid #E8DCC4; padding-bottom: 2px; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="brand">RISA KAWAKAMI</div>
        <div class="deco">・・・</div>

        <div class="label">Mini Movie</div>
        <h1>ママ友が嫌いじゃないのに疲れる私が、<br>やめたこと</h1>

        <div class="video-card">
            <video controls playsinline preload="metadata" poster="poster.png">
                <source src="video.mp4" type="video/mp4">
                お使いのブラウザでは動画を再生できません。
            </video>
        </div>
        <div class="meta">動画 ／ 約1分　音が出ます</div>

        <div class="message">
            「やめた11のこと」の中から、<br>
            3つを1分の動画にしました。<br><br>
            断った回数を数えてしまう。<br>
            帰り道に、ひとりで反省会をしてしまう。<br><br>
            ひとつでも「これ、私もやってる」と思えたら、<br>
            それで十分です。
        </div>

        <a class="btn" href="../mamatomo11/">残りの8つをPDFで読む</a>

        <div class="footer">
            川上 りさ<br>
            <a href="https://lin.ee/wLfIgCo" target="_blank" rel="noopener">LINEで感想を送る</a>
        </div>
    </div>
</body>
</html>
