<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>ミニ動画講座｜比較ばかりしていた私が、自分を取り戻せた3つの気づき</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #FDFBF7;
            color: #4A4A4A;
            font-family: "Shippori Mincho", serif;
            letter-spacing: 0.05em;
            line-height: 2;
        }
        .wrap {
            max-width: 640px;
            margin: 0 auto;
            padding: 48px 20px 64px;
            text-align: center;
        }
        .brand {
            font-family: "Cormorant Garamond", serif;
            font-size: 13px;
            letter-spacing: 5px;
            color: #9c8c8c;
        }
        .deco { color: #d4b5b5; font-size: 14px; letter-spacing: 10px; margin: 18px 0 26px; }
        .label {
            font-family: "Cormorant Garamond", serif;
            font-size: 12px;
            letter-spacing: 4px;
            color: #Cca352;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 19px;
            font-weight: 600;
            line-height: 1.9;
            margin-bottom: 30px;
        }
        .video-card {
            background: #ffffff;
            border: 1px solid #E8DCC4;
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            margin-bottom: 14px;
        }
        video {
            width: 100%;
            display: block;
            border-radius: 8px;
            background: #000;
        }
        .ai-note { font-size: 11px; color: #9a948e; margin-bottom: 40px; }
        .message {
            font-size: 14px;
            text-align: left;
            background: #ffffff;
            border-left: 3px solid #E8D1CB;
            border-radius: 0 10px 10px 0;
            padding: 22px 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            margin-bottom: 48px;
        }
        .footer { font-size: 12px; color: #9c8c8c; }
        .footer a { color: #Cca352; text-decoration: none; border-bottom: 1px solid #E8DCC4; padding-bottom: 2px; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="brand">RISA KAWAKAMI</div>
        <div class="deco">✦ ✦ ✦</div>

        <div class="label">Mini Lecture 001</div>
        <h1>比較ばかりしていた私が、<br>自分を取り戻せた3つの気づき</h1>

        <div class="video-card">
            <video controls playsinline preload="metadata" poster="poster.png">
                <source src="video.mp4" type="video/mp4">
                お使いのブラウザでは動画を再生できません。
            </video>
        </div>
        <div class="ai-note">※この動画の音声はAIで生成しています（約6分40秒）</div>

        <div class="message">
            ご登録、ありがとうございます。<br><br>
            人と比べて落ち込んでしまう。<br>
            たくさん学んでいるのに、なぜか満たされない。<br><br>
            そんなあなたに、まず最初に知ってほしいことを<br>
            6分にぎゅっと詰めました。<br><br>
            お茶でも飲みながら、ゆっくり見てみてくださいね。
        </div>

        <div class="footer">
            川上りさ ｜ <a href="https://risa-hsp.github.io/profile/">プロフィールはこちら</a>
        </div>
    </div>
</body>
</html>
